[pytest]
testpaths = tests
markers =
    slow: tests that take more than a few seconds
    live_server: tests that require a running live server (not the test server)
    allow_real_claude_cli: opt out of the conftest guard that fails tests launching the real Claude CLI
    real_process_scan: opt out of the conftest stub so the test runs the real OS process enumeration

# One suite: unit, API and headless-browser (Playwright) tests, all under tests/.
# The Selenium e2e folder (tests/e2e) was removed 2026-10-28: nothing had run it
# since the --ignore was added, and its page objects targeted screen elements
# that no longer exist.
addopts = -q --timeout=60
timeout = 60
